name: Verify Timer candidate

on:
  # main is the only permanent branch; pushes also validate temporary review branches.
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pins verified against official release tags on 2026-09-21.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node 24 action runtime
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0; Node 24 action runtime
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify source allowlist and package
        run: python3 scripts/build.py
      - name: Verify packaging boundaries
        run: python3 scripts/test_build.py
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Validate Compose and start standalone image
        run: |
          docker compose config --quiet
          docker compose up --build --wait
      - name: Browser regression against standalone Apache
        run: npm test
        env:
          BASE_URL: http://127.0.0.1:8091
      - name: Stop local service
        if: always()
        run: docker compose down
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1; Node 24 action runtime
        with:
          name: timer-local-candidate
          path: build/
          if-no-files-found: error
          retention-days: 7
